esphome:
  name: petkit_fountain
  friendly_name: Petkit Fountain

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Enable OTA updates
ota:

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Petkit Fountain"
    password: !secret fallback_password

# Enable Bluetooth LE
esp32_ble_tracker:

# BLE Client setup for Petkit Fountain
ble_client:
  - mac_address: "XX:XX:XX:XX:XX:XX" # Replace with your Petkit Fountain MAC address
    id: petkit_ble_client

# Petkit Fountain hub setup
petkit_fountain:
  id: my_petkit_fountain
  # Optional parameters:
  # update_interval: 15s  # Default polling interval

# Sensors for Petkit Fountain
sensor:
  - platform: petkit_fountain
    petkit_fountain_id: my_petkit_fountain
    battery_level:
      name: "Petkit Fountain Battery Level"
    voltage:
      name: "Petkit Fountain Battery Voltage"
    filter_percentage:
      name: "Petkit Fountain Filter Percentage"
    pump_runtime:
      name: "Petkit Fountain Pump Runtime"

# Binary Sensors for Petkit Fountain
binary_sensor:
  - platform: petkit_fountain
    petkit_fountain_id: my_petkit_fountain
    power_status:
      name: "Petkit Fountain Power Status"
    water_missing:
      name: "Petkit Fountain Water Missing"
      # Will be ON when water is missing
    filter_warning:
      name: "Petkit Fountain Filter Warning"
      # Will be ON when filter needs replacement
    breakdown:
      name: "Petkit Fountain Breakdown"
      # Will be ON when there's a device breakdown
    led_status:
      name: "Petkit Fountain LED Status"

# Buttons for Petkit Fountain
button:
  - platform: petkit_fountain
    petkit_fountain_id: my_petkit_fountain
    reset_filter:
      name: "Petkit Fountain Reset Filter"
      # Press this button to reset the filter counter

# Switches for Petkit Fountain
switch:
  - platform: petkit_fountain
    petkit_fountain_id: my_petkit_fountain
    power:
      name: "Petkit Fountain Power Switch"
      # Controls the power state of the fountain
    led:
      name: "Petkit Fountain LED Switch"
      # Controls the LED light of the fountain

# Select for Petkit Fountain (Mode selection)
select:
  - platform: petkit_fountain
    petkit_fountain_id: my_petkit_fountain
    mode:
      name: "Petkit Fountain Mode"
      # Select between "Normal" and "Smart" mode
      # Normal mode: constant operation
      # Smart mode: intelligent operation that conserves energy
